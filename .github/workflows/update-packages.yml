name: Perbarui data paket

on:
  schedule:
    # Setiap Senin 12:00 WIB (05:00 UTC). GitHub kadang menjalankan jadwal beberapa menit terlambat.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data dari ventour.co.id
        run: python3 tools/update_packages.py

      - name: Commit bila ada perubahan
        id: commit
        run: |
          if git diff --quiet -- data/packages.json assets/js/packages.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/packages.json assets/js/packages.js
          # Tanpa [skip netlify]: commit ini sengaja memicu satu deploy Netlify per minggu (disetujui pemilik).
          # Tidak ada perubahan data = tidak ada commit = tidak ada deploy.
          git commit -m "Perbarui data paket dari ventour.co.id"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bersihkan cache CDN
        if: steps.commit.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/packages.json" || true
